services:
  postgres-node:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: janggi_user
      POSTGRES_PASSWORD: janggi_password
      POSTGRES_DB: janggi_db
    volumes:
      - ./benchmarks/node-baseline/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janggi_user -d janggi_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres-go:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: janggi_user
      POSTGRES_PASSWORD: janggi_password
      POSTGRES_DB: janggi_db
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janggi_user -d janggi_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mock-ai:
    build: ./tests/mock-ai

  backend-node:
    build: ./benchmarks/node-baseline/backend
    environment:
      DB_HOST: postgres-node
      DB_USER: janggi_user
      DB_PASSWORD: janggi_password
      DB_NAME: janggi_db
      DB_PORT: 5432
      PORT: 3000
      AI_SERVICE_URL: http://mock-ai:4101
      AI_MOVE_TIME_MS: 700
      JWT_SECRET: secret_key
    depends_on:
      postgres-node:
        condition: service_healthy
      mock-ai:
        condition: service_started
    ports:
      - "3101:3000"

  backend-go:
    build: ./backend
    environment:
      DB_HOST: postgres-go
      DB_USER: janggi_user
      DB_PASSWORD: janggi_password
      DB_NAME: janggi_db
      DB_PORT: 5432
      PORT: 3000
      AI_SERVICE_URL: http://mock-ai:4101
      AI_MOVE_TIME_MS: 700
      JWT_SECRET: secret_key
    depends_on:
      postgres-go:
        condition: service_healthy
      mock-ai:
        condition: service_started
    ports:
      - "3102:3000"

  ai-node:
    build: ./benchmarks/node-baseline/ai-server
    environment:
      PORT: 4000
      AI_VARIANT: janggi
      AI_MOVE_TIME_MS: 700
    ports:
      - "4102:4000"

  ai-go:
    build: ./ai-server
    environment:
      PORT: 4000
      AI_VARIANT: janggi
      AI_MOVE_TIME_MS: 700
    ports:
      - "4103:4000"

  ai-node-fake:
    build: ./benchmarks/node-baseline/ai-server
    environment:
      PORT: 4000
      STOCKFISH_PATH: /usr/local/bin/fake-engine
      AI_VARIANT: janggi
      AI_MOVE_TIME_MS: 700
    volumes:
      - ./tests/fake-engine/fake-engine.sh:/usr/local/bin/fake-engine:ro
    ports:
      - "4202:4000"

  ai-go-fake:
    build: ./ai-server
    environment:
      PORT: 4000
      STOCKFISH_PATH: /usr/local/bin/fake-engine
      AI_VARIANT: janggi
      AI_MOVE_TIME_MS: 700
    volumes:
      - ./tests/fake-engine/fake-engine.sh:/usr/local/bin/fake-engine:ro
    ports:
      - "4203:4000"
